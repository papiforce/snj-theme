<!-- ======================================================================
     SNJ — à insérer dans le template overall_header, juste avant </head>.
     1. Applique le thème AVANT l'affichage (pas de flash clair/sombre).
     2. Charge les polices et le CSS des composants (jsDelivr, version figée).
     ====================================================================== -->
<script>
(function () {
  var KEY = 'snj-theme';
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', saved === 'light' || saved === 'dark' ? saved : system);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,400&family=Zen+Antique&family=Noto+Serif+JP:wght@500;700&display=swap">
