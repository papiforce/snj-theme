<!--
  À insérer dans index_body (PA › Affichage › Templates › Général › index_body),
  juste avant {CHATBOX_BOTTOM}, puis enregistrer et PUBLIER le template.
  Le template d'AwesomeBB ne contient pas ces statistiques ; stats.js (module 13) les lit ici
  pour le bloc « Qui est en ligne » de l'accueil.
-->
<div id="sg-stats-data" hidden><span data-k="posts">{TOTAL_POSTS}</span><span data-k="users">{TOTAL_USERS}</span><span data-k="newest">{NEWEST_USER}</span></div>
